<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-labelledby="title desc" role="img">
  <title id="title">AIDA Logo</title>
  <desc id="desc">Stylized A formed by data nodes and arcs representing analysis and insight.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="64" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="#0b1220"/>
  <circle cx="64" cy="64" r="58" fill="url(#glow)"/>
  <!-- Data orbits -->
  <g fill="none" stroke="url(#g)" stroke-width="3" opacity="0.85">
    <ellipse cx="64" cy="64" rx="46" ry="18"/>
    <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(60 64 64)"/>
    <ellipse cx="64" cy="64" rx="46" ry="18" transform="rotate(120 64 64)"/>
  </g>
  <!-- A lettermark -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 96 L64 24 L96 96" fill="none" stroke="#e5edff" stroke-width="8"/>
    <path d="M46 72 H82" stroke="url(#g)" stroke-width="6"/>
  </g>
  <!-- Nodes -->
  <g fill="#22d3ee" opacity="0.95">
    <circle cx="64" cy="24" r="4"/>
    <circle cx="32" cy="96" r="4"/>
    <circle cx="96" cy="96" r="4"/>
    <circle cx="64" cy="72" r="3.5"/>
  </g>
</svg>

